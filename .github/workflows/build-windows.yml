name: Build Windows v4.0.0 (portable + setup)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          python -m pip install -r server/requirements.txt
          python -m pip install "pyinstaller>=6.5"
      - name: Build portable EXE
        run: |
          cd desktop
          python build_windows.py
      - name: Build updater helper
        run: |
          cd desktop
          python build_updater.py
      - name: Packaged EXE smoke test (real backend)
        timeout-minutes: 5
        env:
          PROXYHUNTER_BACKEND_URL: http://127.0.0.1:8000
          PROXYHUNTER_API_KEY: testkey
          PROXYHUNTER_SELFTEST: "1"
        run: |
          # GitHub Actions terminates processes started by a step when that
          # step ends, so the backend must live inside this step.
          $env:PROXYHUNTER_API_KEY = "testkey"
          $env:PROXYHUNTER_DATA_DIR = "$PWD\\backend-data"
          $env:PROXYHUNTER_GATEWAY_PORT = "18080"
          New-Item -ItemType Directory -Force -Path backend-data | Out-Null
          $backend = $null
          try {
            $backend = Start-Process -FilePath python -ArgumentList "server/main.py" -WorkingDirectory "$PWD" -WindowStyle Hidden -PassThru -RedirectStandardOutput backend-data/server.out -RedirectStandardError backend-data/server.err
            $backend.Id | Out-File -Encoding ascii backend-data/server.pid
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 3
                if ($health.ok) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) {
              Write-Host "--- backend stdout ---"; Get-Content backend-data/server.out -ErrorAction SilentlyContinue
              Write-Host "--- backend stderr ---"; Get-Content backend-data/server.err -ErrorAction SilentlyContinue
              throw "Backend did not become healthy"
            }
            Write-Host "Backend healthy: $($health | ConvertTo-Json -Compress)"

            New-Item -ItemType Directory -Force -Path clean-test | Out-Null
            Copy-Item builds/ProxyHunter.exe clean-test/ProxyHunter.exe -Force
            Push-Location clean-test
            try {
              $p = Start-Process -FilePath (Resolve-Path .\ProxyHunter.exe) -ArgumentList '--selftest' -PassThru
              $exited = $p.WaitForExit(210000)
              if (-not $exited) {
                try { $p.Kill() } catch { }
                Write-Host "--- selftest.log ---"; Get-Content selftest.log -ErrorAction SilentlyContinue
                Write-Host "--- crash.log ---"; Get-Content crash.log -ErrorAction SilentlyContinue
                throw "Selftest timed out after 210s"
              }
              Write-Host "Selftest exit code: $($p.ExitCode)"
              Write-Host "--- selftest.log ---"; Get-Content selftest.log -ErrorAction SilentlyContinue
              Write-Host "--- crash.log ---"; Get-Content crash.log -ErrorAction SilentlyContinue
              if (!(Test-Path selftest.json)) { throw "Selftest marker missing (exit $($p.ExitCode))" }
              $result = Get-Content selftest.json -Raw | ConvertFrom-Json
              if (-not $result.ok) { throw "Packaged selftest failed: $($result.error)" }
              if ($result.sources_enabled -lt 1) { throw "No enabled sources in packaged app" }
              if ($result.discovered -lt 1) { throw "Discovery returned no proxies" }
              if ($result.export_files.Count -ne 3) { throw "Expected 3 export files, got $($result.export_files.Count)" }
              if (-not $result.json_verified) { throw "Exported JSON failed verification" }
              if (-not $result.csv_verified) { throw "Exported CSV failed verification" }
              if (-not $result.txt_verified) { throw "Exported TXT failed verification" }
              if (-not $result.gateway_ok) { throw "Gateway did not reach ONLINE" }
              if (-not $result.resources_ok) { throw "Packaged sources.json/config.json missing" }
              if (-not $result.auth_ok) { throw "Backend authentication check failed" }
              if (-not $result.connection_saved) { throw "Connection store round-trip failed" }
              if ($p.ExitCode -ne 0) { throw "Selftest exited with $($p.ExitCode)" }
              Write-Host "Sources: $($result.sources_total)/$($result.sources_enabled) enabled, discovered=$($result.discovered), checked=$($result.checked)"
              Write-Host "Sections: $($result.sections -join ', ')"
              Get-Content selftest.json
            } finally {
              Pop-Location
            }
          } finally {
            if ($backend -and -not $backend.HasExited) {
              Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
            }
            Write-Host "--- backend stdout ---"; Get-Content backend-data/server.out -ErrorAction SilentlyContinue
            Write-Host "--- backend stderr ---"; Get-Content backend-data/server.err -ErrorAction SilentlyContinue
          }
      - name: Updater replace / version / rollback smoke test
        timeout-minutes: 3
        env:
          PROXYHUNTER_BACKEND_URL: http://127.0.0.1:8000
          PROXYHUNTER_API_KEY: testkey
        run: |
          New-Item -ItemType Directory -Force updater-test | Out-Null
          Copy-Item builds/ProxyHunter.exe updater-test/ProxyHunter.exe -Force
          Copy-Item builds/ProxyHunter.exe updater-test/ProxyHunter_new.exe -Force
          Copy-Item builds/ProxyHunterUpdater.exe updater-test/ProxyHunterUpdater.exe -Force
          cd updater-test
          # Successful replacement: the helper must verify the new EXE's version
          # and relaunch it without leaving the old process locked.
          $p = Start-Process -FilePath .\ProxyHunterUpdater.exe -ArgumentList '.\ProxyHunter.exe','.\ProxyHunter_new.exe','0','4.0.0' -PassThru
          if (-not $p.WaitForExit(90000)) { try { $p.Kill() } catch { }; throw 'Updater helper timed out' }
          Write-Host "Updater exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Updater replacement failed: $($p.ExitCode)" }
          Get-Process ProxyHunter -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $env:PROXYHUNTER_VERSION_FILE = "$PWD\version-check.txt"
          $v = Start-Process -FilePath .\ProxyHunter.exe -ArgumentList '--version' -PassThru
          if (-not $v.WaitForExit(30000)) { try { $v.Kill() } catch { }; throw 'Version check timed out' }
          if ((Get-Content version-check.txt -Raw).Trim() -ne '4.0.0') { throw 'Updated EXE reported the wrong version' }
          Remove-Item Env:PROXYHUNTER_VERSION_FILE
          # Rollback: a corrupt replacement must be rejected and the backup restored.
          Set-Content -Path ProxyHunter_bad.exe -Value 'not-a-real-executable' -Encoding ascii
          $r = Start-Process -FilePath .\ProxyHunterUpdater.exe -ArgumentList '.\ProxyHunter.exe','.\ProxyHunter_bad.exe','0','4.0.0' -PassThru
          if (-not $r.WaitForExit(90000)) { try { $r.Kill() } catch { }; throw 'Rollback helper timed out' }
          Write-Host "Rollback exit code: $($r.ExitCode)"
          if ($r.ExitCode -eq 0) { throw 'Corrupt update was not rejected' }
          $env:PROXYHUNTER_VERSION_FILE = "$PWD\rollback-check.txt"
          $v2 = Start-Process -FilePath .\ProxyHunter.exe -ArgumentList '--version' -PassThru
          if (-not $v2.WaitForExit(30000)) { try { $v2.Kill() } catch { }; throw 'Rollback version check timed out' }
          if ((Get-Content rollback-check.txt -Raw).Trim() -ne '4.0.0') { throw 'Rollback did not restore the working EXE' }
          Remove-Item Env:PROXYHUNTER_VERSION_FILE
          Write-Host 'Updater replace/version/rollback PASS'
      - name: Upload selftest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-selftest-report
          if-no-files-found: ignore
          path: |
            clean-test/selftest.json
            clean-test/selftest.log
            clean-test/crash.log
            backend-data/server.out
            backend-data/server.err
      - name: Stop backend
        if: always()
        run: |
          if (Test-Path backend-data/server.pid) { Stop-Process -Id (Get-Content backend-data/server.pid) -Force -ErrorAction SilentlyContinue }
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "--- backend stdout ---"; Get-Content backend-data/server.out -ErrorAction SilentlyContinue
          Write-Host "--- backend stderr ---"; Get-Content backend-data/server.err -ErrorAction SilentlyContinue
      - name: Rename portable executable
        run: |
          Copy-Item builds/ProxyHunter.exe builds/ProxyHunter_v4.0.0_Windows.exe -Force
          Get-Item builds/ProxyHunter_v4.0.0_Windows.exe | Format-List Name,Length
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc desktop/installer.iss /Qp
      - name: Verify Setup.exe
        run: |
          if (!(Test-Path builds/ProxyHunter_v4.0.0_Setup.exe)) { throw 'Setup.exe missing' }
          Get-Item builds/ProxyHunter_v4.0.0_Setup.exe | Format-List Name,Length
      - name: Package portable ZIP
        run: Compress-Archive -Path builds/ProxyHunter_v4.0.0_Windows.exe -DestinationPath builds/ProxyHunter_v4.0.0_Windows_portable.zip -Force
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-v4.0.0-Windows
          path: |
            builds/ProxyHunter_v4.0.0_Windows.exe
            builds/ProxyHunter_v4.0.0_Setup.exe
            builds/ProxyHunter_v4.0.0_Windows_portable.zip
            builds/ProxyHunterUpdater.exe
      - name: Signing notice
        run: echo "Artifacts are UNSIGNED unless a code-signing certificate secret is configured."
