name: Build Windows v3.0 (portable + setup)

on:
  workflow_dispatch:
  push:
    tags: ['v3.*']

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          python -m pip install "pyinstaller>=6.5"
      - name: Build portable EXE
        run: |
          cd desktop
          python -m PyInstaller --noconfirm --distpath ../builds/ProxyHunter_portable ProxyHunter.spec
      - name: Smoke test EXE startup
        run: |
          cd builds/ProxyHunter_portable
          .\ProxyHunter.exe --selftest
          if (!(Test-Path selftest.json)) { throw 'Selftest marker missing' }
          Get-Content selftest.json
      - name: Rename portable executable
        run: |
          Copy-Item builds/ProxyHunter_portable/ProxyHunter.exe builds/ProxyHunter_v3.0_Windows.exe -Force
          Get-Item builds/ProxyHunter_v3.0_Windows.exe | Format-List Name,Length
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc desktop/installer.iss /Qp
      - name: Verify Setup.exe
        run: |
          if (!(Test-Path builds/ProxyHunter_v3.0_Setup.exe)) { throw 'Setup.exe missing' }
          Get-Item builds/ProxyHunter_v3.0_Setup.exe | Format-List Name,Length
      - name: Package portable ZIP
        run: Compress-Archive -Path builds/ProxyHunter_portable/* -DestinationPath builds/ProxyHunter_v3.0_Windows_portable.zip -Force
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-v3.0-Windows
          path: |
            builds/ProxyHunter_v3.0_Windows.exe
            builds/ProxyHunter_v3.0_Setup.exe
            builds/ProxyHunter_v3.0_Windows_portable.zip
      - name: Signing notice
        run: echo "Artifacts are UNSIGNED unless a code-signing certificate secret is configured."
