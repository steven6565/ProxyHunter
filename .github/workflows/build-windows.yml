name: Build Windows v3.0 (portable + setup)

on:
  workflow_dispatch:
  push:
    tags: ['v3.*']

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt
          python -m pip install "pyinstaller>=6.5"
      - name: Build portable EXE
        run: |
          cd desktop
          python build_windows.py
      - name: Clean-directory packaged EXE smoke test
        run: |
          New-Item -ItemType Directory -Force -Path clean-test | Out-Null
          Copy-Item builds/ProxyHunter.exe clean-test/ProxyHunter.exe -Force
          cd clean-test
          Start-Process -FilePath (Resolve-Path .\ProxyHunter.exe) -ArgumentList '--selftest' -Wait
          Start-Sleep -Seconds 2
          if (!(Test-Path selftest.json)) { throw 'Selftest marker missing' }
          $result = Get-Content selftest.json -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "GUI selftest failed: $($result.error)" }
          if ($result.sources_enabled -lt 1) { throw 'No enabled sources in packaged app' }
          if ($result.discovered -lt 1) { throw 'Packaged discovery returned zero proxies' }
          if ($result.checked -lt 1) { throw 'Packaged validation returned zero results' }
          if ($result.export_files.Count -ne 3) { throw 'Packaged export files missing' }
          Write-Host "Sources: $($result.sources_total)/$($result.sources_enabled) enabled, discovered=$($result.discovered)"
          Write-Host "Sections: $($result.sections -join ', ')"
          Get-Content selftest.json
      - name: Rename portable executable
        run: |
          Copy-Item builds/ProxyHunter.exe builds/ProxyHunter_v3.1.2_Windows.exe -Force
          Get-Item builds/ProxyHunter_v3.1.2_Windows.exe | Format-List Name,Length
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc desktop/installer.iss /Qp
      - name: Verify Setup.exe
        run: |
          if (!(Test-Path builds/ProxyHunter_v3.1.2_Setup.exe)) { throw 'Setup.exe missing' }
          Get-Item builds/ProxyHunter_v3.1.2_Setup.exe | Format-List Name,Length
      - name: Package portable ZIP
        run: Compress-Archive -Path builds/ProxyHunter_v3.1.2_Windows.exe -DestinationPath builds/ProxyHunter_v3.1.2_Windows_portable.zip -Force
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-v3.0-Windows
          path: |
            builds/ProxyHunter_v3.1.2_Windows.exe
            builds/ProxyHunter_v3.1.2_Setup.exe
            builds/ProxyHunter_v3.1.2_Windows_portable.zip
      - name: Signing notice
        run: echo "Artifacts are UNSIGNED unless a code-signing certificate secret is configured."
