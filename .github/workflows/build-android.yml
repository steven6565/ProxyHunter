name: Build Android v3.0 APK

on:
  workflow_dispatch:
  push:
    tags: ['v3.*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Verify APK is genuine
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -f "$APK" || { echo "APK missing"; exit 1; }
          unzip -l "$APK" | grep -E 'classes.*dex|AndroidManifest.xml' | head
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then echo "APK too small"; exit 1; fi
          cp "$APK" builds/ProxyHunter_v3.0_Android.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-v3.0-Android
          path: builds/ProxyHunter_v3.0_Android.apk
      - name: Signing notice
        run: echo "Debug APK is signed with the Android debug key. Create an upload keystore for release signing."
