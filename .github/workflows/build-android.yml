name: Build Android v3.1.1 APK

on:
  workflow_dispatch:
  push:
    tags: ['v3.*']

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required SDK platform
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build app + instrumentation APKs
        working-directory: android
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Verify APK is genuine
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -f "$APK" || { echo "APK missing"; exit 1; }
          unzip -l "$APK" | grep -E 'classes.*dex|AndroidManifest.xml' | head
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then echo "APK too small"; exit 1; fi
          cp "$APK" builds/ProxyHunter_v3.1.2_Android.apk
          TEST_APK=$(find android/app/build/outputs/apk/androidTest -name '*androidTest*.apk' | head -1)
          test -f "$TEST_APK" || { echo "instrumentation APK missing"; exit 1; }
      - name: Package APKs for emulator test
        run: |
          mkdir -p builds/apks
          cp $(find android/app/build/outputs/apk -name 'app-debug.apk' | head -1) builds/apks/
          cp $(find android/app/build/outputs/apk/androidTest -name '*androidTest*.apk' | head -1) builds/apks/
          ls -l builds/apks
      - name: Upload APKs for emulator test
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-v3.1.2-apks
          path: builds/apks/*.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-v3.1.2-Android
          path: builds/ProxyHunter_v3.1.2_Android.apk
      - name: Signing notice
        run: echo "Debug APK is signed with the Android debug key. Create an upload keystore for release signing."

  emulator-test:
    needs: android
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ProxyHunter-v3.1.2-apks
          path: apks
      - name: Installed-APK instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # The emulator action executes each script line in its own shell,
          # so every command below is self-contained on a single line.
          script: |
            ls -R "$GITHUB_WORKSPACE/apks"
            adb install -r "$GITHUB_WORKSPACE/apks/app-debug.apk"
            adb install -r "$GITHUB_WORKSPACE/apks/app-debug-androidTest.apk"
            adb shell pm grant com.proxyhunter.app android.permission.POST_NOTIFICATIONS || true
            adb shell am instrument -w -r -e package com.proxyhunter.app com.proxyhunter.app.test/androidx.test.runner.AndroidJUnitRunner > emulator-test.txt 2>&1
            cat emulator-test.txt
            grep -q "OK (" emulator-test.txt || { echo "INSTRUMENTATION_FAILED"; adb logcat -d -t 400 > logcat.txt; cat logcat.txt; cat emulator-test.txt; exit 1; }
      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-v3.1.2-emulator-test
          path: |
            emulator-test.txt
            logcat.txt
