name: Build Android v3.0 APK

on:
  workflow_dispatch:
  push:
    tags: ['v3.*']

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required SDK platform
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Verify APK is genuine
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -f "$APK" || { echo "APK missing"; exit 1; }
          unzip -l "$APK" | grep -E 'classes.*dex|AndroidManifest.xml' | head
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then echo "APK too small"; exit 1; fi
          cp "$APK" builds/ProxyHunter_v3.0_Android.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProxyHunter-v3.0-Android
          path: builds/ProxyHunter_v3.0_Android.apk
      - name: Signing notice
        run: echo "Debug APK is signed with the Android debug key. Create an upload keystore for release signing."
